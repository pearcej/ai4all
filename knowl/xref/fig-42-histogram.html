<div class="para" id="fig-42-histogram-2-2-1">A vertical histogram illustrating the distribution of student scores on a psychology test. The horizontal axis represents test scores divided into 10-point class intervals ranging from 39.5 to 169.5. The vertical axis measures student frequency, scaled from 0 to 150.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-42-histogram-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-42-histogram-2-2-2">The distribution is right-skewed, rising sharply from low frequencies at the low end to a prominent peak in the middle before tapering off gradually across a long upper tail:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-42-histogram-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-42-histogram-2-2-3">The lowest interval (39.5–49.5) contains only 2 to 3 students. Frequencies increase rapidly in subsequent bins, with approximately 12 students in the 49.5–59.5 range, 50 in 59.5–69.5, and just over 100 in 69.5–79.5. The distribution reaches its peak in the 79.5–89.5 interval at nearly 150 students. Beyond the peak, frequencies steadily decline: just over 125 students in 89.5–99.5, around 75 in 99.5–109.5, 60 in 109.5–119.5, 35 in 119.5–129.5, 15 in 129.5–139.5, and 8 in 139.5–149.5. The final two high-score intervals each contain only a single student.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-42-histogram-2-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

<div class="para" id="fig-tic-tac-toe-goal-state-2-2-1">A tree diagram illustrating three levels of moves in a tic-tac-toe game. The diagram is structured vertically from top to bottom with a hierarchical branching pattern. At the top is the root node, which displays a 3x3 tic-tac-toe grid representing the current state of the game with three empty squares remaining.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tic-tac-toe-goal-state-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<div class="para" id="fig-tic-tac-toe-goal-state-2-2-2">From the root node, three branches extend downward, labeled Action 1, Action 2, and Action 3. Each branch represents a possible move for player O, corresponding to one of the three remaining empty positions on the grid. Each node at this level displays the resulting board state with O placed in the corresponding position.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tic-tac-toe-goal-state-2-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-tic-tac-toe-goal-state-2-2-3">At the second level, each action branches further. Action 1 leads to two branches labeled Action 1.1 and Action 1.2. Action 2 leads to two branches labeled Action 2.1 and Action 2.2. Action 3 leads to two branches labeled Action 3.1 and Action 3.2. Each of these branches represents a possible response move for player X from the resulting state after O’s first action. Each node at this level displays the resulting board state with X placed in the corresponding position.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tic-tac-toe-goal-state-2-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="fig-tic-tac-toe-goal-state-2-2-4">At the third level, Action 1.1 leads to Action 1.1.1, Action 1.2 leads to Action 1.2.1, Action 2.2 leads to Action 2.2.1, and Action 3.2 leads to Action 3.2.1, representing possible moves for player O from the resulting states. Action 2.1 and Action 3.1 are shown without further branching. Each node at this level displays the resulting board state with O placed in the corresponding position.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#fig-tic-tac-toe-goal-state-2-2-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
